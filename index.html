<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="MuscleIQ privacy policy in Arabic, English, German, Spanish and French.">
<title>Privacy Policy — MuscleIQ</title>
<style>
:root{color-scheme:light dark;--bg:#F5F3FA;--surface:#FFFFFF;--line:#DDD8EC;--text:#16141F;--muted:#55506B;--accent:#5B4BC4;--wash:#EEECF9}
@media (prefers-color-scheme:dark){:root{--bg:#12101A;--surface:#1A1726;--line:#332E45;--text:#ECEAF2;--muted:#A8A3BA;--accent:#A68CFF;--wash:#241F3D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
[lang="ar"]{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif}
.wrap{max-width:32rem;margin:0 auto;padding:40px 16px 48px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#9D82FF,#D35FE0);flex:none}
h1{font-size:1.5rem;line-height:1.3;margin:28px 0 4px}
.updated{color:var(--muted);font-size:15px;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.lang{display:flex;flex-direction:column;gap:2px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--text);text-decoration:none;min-height:44px}
a.lang:hover,a.lang:focus-visible{border-color:var(--accent);background:var(--wash)}
a.lang:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.name{font-weight:600;font-size:18px}
.doc{color:var(--muted);font-size:15px}
a.lang[dir="rtl"]{text-align:right}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true"></span>MuscleIQ</div>
  <h1>Privacy Policy</h1>
  <p class="updated">2026-11-10</p>
  <ul>
    <li><a class="lang" href="privacy-ar.html" hreflang="ar" lang="ar" dir="rtl"><span class="name">العربية</span><span class="doc">سياسة الخصوصية</span></a></li>
    <li><a class="lang" href="privacy-en.html" hreflang="en" lang="en"><span class="name">English</span><span class="doc">Privacy Policy</span></a></li>
    <li><a class="lang" href="privacy-de.html" hreflang="de" lang="de"><span class="name">Deutsch</span><span class="doc">Datenschutzerklärung</span></a></li>
    <li><a class="lang" href="privacy-es.html" hreflang="es" lang="es"><span class="name">Español</span><span class="doc">Política de privacidad</span></a></li>
    <li><a class="lang" href="privacy-fr.html" hreflang="fr" lang="fr"><span class="name">Français</span><span class="doc">Politique de confidentialité</span></a></li>
  </ul>
</main>
</body>
</html>
